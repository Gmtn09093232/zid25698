<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearthside — A quieter way to meet someone real.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=Inter:wght@400;500;600&display=swap">
<script>
  (function () {
    try {
      var s = localStorage.getItem("hearthside-theme");
      var m = matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", s || (m ? "dark" : "light"));
    } catch (e) {}
  })();
</script>
<style>
/* ============ tokens ============ */
:root {
  --bg:#faf6ee; --surface:#fff; --surface-2:#efe6d6; --text:#1a1310; --text-muted:#6b6259;
  --border:#e3d9c6; --primary:#d4622a; --primary-hover:#b9501e; --primary-fg:#fff;
  --accent:#2f4a3c; --danger:#b23a1e; --success:#2f6b4a;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-pill:999px;
  --shadow-e1:0 1px 3px rgba(26,19,16,.06); --shadow-e2:0 4px 12px rgba(26,19,16,.08);
  --ease:cubic-bezier(.2,0,0,1);
  --font-display:"Bricolage Grotesque",ui-serif,Georgia,serif;
  --font-sans:"Inter",ui-sans-serif,system-ui,sans-serif;
}
[data-theme="dark"] {
  --bg:#14100e; --surface:#1e1815; --surface-2:#2a2220; --text:#f2eadb; --text-muted:#a69b8c;
  --border:#352c28; --primary:#e07a45; --primary-hover:#f08f5c; --primary-fg:#1a1310;
  --accent:#7aa88f; --danger:#e0765a; --success:#7aa88f;
}
/* ============ base ============ */
*,*::before,*::after{box-sizing:border-box;border-color:var(--border);}
html{color-scheme:light;} [data-theme="dark"]{color-scheme:dark;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.01em;margin:0;line-height:1.15;}
p{margin:0;} a{color:inherit;text-decoration:none;} a:hover{text-decoration:underline;}
img{display:block;max-width:100%;} ul{margin:0;padding:0;list-style:none;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px;}
.muted{color:var(--text-muted);} .small{font-size:13px;} .hide-sm{display:none;}
@media (min-width:640px){.hide-sm{display:inline-flex;}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important;}}
/* ============ layout ============ */
.container{width:100%;margin:0 auto;padding:0 20px;max-width:720px;}
.container-lg{max-width:1180px;}
#app{min-height:60vh;}
.section{padding:80px 0;} .section-tight{padding:48px 0;}
.stack>*+*{margin-top:16px;}
/* ============ header/footer ============ */
.site-header{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(180%) blur(12px);}
.header-row{display:flex;align-items:center;gap:24px;height:64px;justify-content:space-between;}
.brand-mark{font-family:var(--font-display);font-weight:600;font-size:18px;}
.nav-desktop{display:none;gap:4px;}
@media (min-width:768px){.nav-desktop{display:flex;}}
.nav-desktop a{padding:8px 12px;border-radius:var(--radius-pill);font-size:14px;color:var(--text-muted);transition:background .15s var(--ease);}
.nav-desktop a:hover,.nav-desktop a.active{background:var(--surface-2);color:var(--text);text-decoration:none;}
.header-actions{display:flex;gap:8px;align-items:center;}
.icon-moon{display:none;} [data-theme="dark"] .icon-sun{display:none;} [data-theme="dark"] .icon-moon{display:inline;}
.site-footer{margin-top:96px;border-top:1px solid var(--border);background:var(--surface);}
.footer-grid{display:grid;gap:32px;padding:56px 20px;}
@media (min-width:768px){.footer-grid{grid-template-columns:1.4fr 1fr 1fr 1fr;}}
.footer-grid h3{font-size:14px;font-family:var(--font-sans);font-weight:600;}
.footer-grid ul{margin-top:12px;display:grid;gap:8px;}
.footer-grid a{font-size:14px;color:var(--text-muted);}
.footer-bottom{border-top:1px solid var(--border);}
.footer-bottom-row{display:flex;flex-direction:column;gap:8px;padding:20px;font-size:12px;color:var(--text-muted);}
@media (min-width:640px){.footer-bottom-row{flex-direction:row;justify-content:space-between;}}
/* ============ buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--radius-pill);font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .15s var(--ease),transform .1s var(--ease);}
.btn:disabled{opacity:.5;cursor:not-allowed;} .btn:active:not(:disabled){transform:translateY(1px);}
.btn-primary{background:var(--primary);color:var(--primary-fg);} .btn-primary:hover{background:var(--primary-hover);text-decoration:none;}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border);} .btn-secondary:hover{background:var(--surface-2);text-decoration:none;}
.btn-ghost{background:transparent;color:var(--text);} .btn-ghost:hover{background:var(--surface-2);text-decoration:none;}
.btn-danger{background:var(--danger);color:#fff;} .btn-danger:hover{opacity:.9;text-decoration:none;}
.btn-sm{height:36px;padding:0 14px;font-size:13px;}
.btn-lg{height:52px;padding:0 28px;font-size:16px;}
.btn-block{width:100%;}
/* ============ forms ============ */
.input,.textarea,.select{width:100%;padding:10px 14px;font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);transition:border-color .15s var(--ease);}
.input{height:44px;} .select{height:44px;}
.textarea{min-height:120px;resize:vertical;}
.input:focus,.textarea:focus,.select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 25%,transparent);}
.input::placeholder,.textarea::placeholder{color:var(--text-muted);}
.field{display:grid;gap:6px;}
.field-label{font-size:13px;font-weight:500;}
.field-help{font-size:12px;color:var(--text-muted);}
.field-error{font-size:12px;color:var(--danger);}
/* ============ card/badge ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-e1);}
.card-body{padding:24px;}
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:500;background:var(--surface-2);color:var(--text);}
.badge-primary{background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary);}
.badge-outline{background:transparent;border:1px solid var(--border);color:var(--text-muted);}
.badge-success{background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success);}
/* ============ utilities ============ */
.grid{display:grid;gap:24px;}
.grid-3{grid-template-columns:1fr;}
@media (min-width:640px){.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (min-width:960px){.grid-3{grid-template-columns:repeat(3,1fr);}}
.lead{font-size:18px;color:var(--text-muted);}
.hero-h1{font-size:clamp(36px,5vw,60px);} .page-h1{font-size:clamp(32px,4vw,48px);}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.row-between{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;}
/* ============ page-specific ============ */
.sample-card-photo{height:224px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:linear-gradient(135deg,var(--surface-2),color-mix(in srgb,var(--primary) 12%,var(--surface-2)));}
.draft-banner{padding:16px;border-radius:var(--radius-md);background:var(--surface-2);}
.legal-block h2{font-size:20px;} .legal-block p{margin-top:8px;color:var(--text-muted);}
.legal-block+.legal-block{margin-top:32px;}
.guideline{border-left:3px solid var(--primary);padding-left:20px;} .guideline+.guideline{margin-top:32px;}
.guideline p{margin-top:8px;color:var(--text-muted);}
details.faq{padding:20px 0;border-bottom:1px solid var(--border);}
details.faq summary{cursor:pointer;font-family:var(--font-display);font-size:18px;font-weight:600;list-style:none;}
details.faq summary::-webkit-details-marker{display:none;}
details.faq summary::after{content:" +";color:var(--text-muted);float:right;}
details.faq[open] summary::after{content:" –";}
details.faq p{margin-top:12px;color:var(--text-muted);}
/* ============ auth pages ============ */
.auth-wrap{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.auth-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-e2);padding:32px;}
.auth-card h1{font-size:24px;margin-bottom:6px;} .auth-card .sub{color:var(--text-muted);font-size:14px;margin-bottom:24px;}
.auth-card form{display:grid;gap:16px;}
.auth-foot{margin-top:20px;font-size:14px;color:var(--text-muted);text-align:center;}
.auth-foot a{color:var(--primary);font-weight:500;}
.notice{padding:12px 14px;border-radius:var(--radius-md);font-size:14px;margin-bottom:16px;}
.notice-error{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);}
.notice-success{background:color-mix(in srgb,var(--success) 12%,transparent);color:var(--success);}
.notice-info{background:var(--surface-2);color:var(--text);}
/* ============ wizard ============ */
.wizard{padding:40px 20px;max-width:560px;margin:0 auto;}
.wizard-progress{display:flex;gap:6px;margin-bottom:8px;}
.wizard-progress span{flex:1;height:4px;background:var(--surface-2);border-radius:2px;transition:background .3s var(--ease);}
.wizard-progress span.done{background:var(--primary);} .wizard-progress span.current{background:color-mix(in srgb,var(--primary) 55%,var(--surface-2));}
.wizard-step-label{font-size:12px;color:var(--text-muted);margin-bottom:24px;}
.wizard h2{font-size:26px;margin-bottom:6px;}
.wizard .sub{color:var(--text-muted);margin-bottom:24px;font-size:15px;}
.wizard-actions{display:flex;gap:12px;justify-content:space-between;margin-top:32px;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--surface);font-size:14px;cursor:pointer;transition:all .15s var(--ease);}
.chip:hover{border-color:var(--primary);}
.chip.selected{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.photo-slot{aspect-ratio:3/4;border-radius:var(--radius-md);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;background:var(--surface-2);position:relative;overflow:hidden;cursor:pointer;transition:border-color .15s var(--ease);}
.photo-slot:hover{border-color:var(--primary);}
.photo-slot img{width:100%;height:100%;object-fit:cover;}
.photo-slot .remove{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1;}
.photo-slot .label{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:4px;}
/* ============ settings nav ============ */
.settings-layout{display:grid;gap:32px;padding:40px 0;}
@media (min-width:768px){.settings-layout{grid-template-columns:220px 1fr;}}
.settings-nav{display:flex;gap:4px;flex-direction:row;overflow-x:auto;}
@media (min-width:768px){.settings-nav{flex-direction:column;overflow-x:visible;}}
.settings-nav a{padding:10px 14px;border-radius:var(--radius-md);font-size:14px;color:var(--text-muted);white-space:nowrap;}
.settings-nav a:hover{background:var(--surface-2);color:var(--text);text-decoration:none;}
.settings-nav a.active{background:var(--surface-2);color:var(--text);font-weight:500;}
.settings-panel h1{font-size:24px;margin-bottom:6px;}
.settings-panel .sub{color:var(--text-muted);font-size:14px;margin-bottom:24px;}
.settings-panel form{display:grid;gap:20px;max-width:560px;}
.settings-panel fieldset{border:0;padding:0;margin:0;}
.settings-panel .section-label{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:12px;}
/* ============ avatar menu ============ */
.avatar-btn{display:inline-flex;align-items:center;gap:8px;padding:4px;border-radius:var(--radius-pill);border:1px solid transparent;background:transparent;cursor:pointer;font:inherit;color:inherit;}
.avatar-btn:hover{background:var(--surface-2);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;}
.menu-wrap{position:relative;}
.menu{position:absolute;top:calc(100% + 8px);right:0;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-e2);padding:6px;display:none;z-index:50;}
.menu.open{display:block;}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:8px 12px;font:inherit;font-size:14px;color:var(--text);background:none;border:0;border-radius:var(--radius-sm);cursor:pointer;}
.menu a:hover,.menu button:hover{background:var(--surface-2);text-decoration:none;}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0;}
/* ============ skeleton ============ */
.skeleton{background:var(--surface-2);border-radius:var(--radius-md);animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
</style>
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main id="app" aria-live="polite"></main>
  <footer class="site-footer">
    <div class="container container-lg footer-grid">
      <div>
        <p class="brand-mark">Hearthside</p>
        <p class="muted small">A quieter way to meet someone real.</p>
      </div>
      <div><h3>Product</h3><ul>
        <li><a href="#/how-it-works" data-link>How it works</a></li>
        <li><a href="#/discover-preview" data-link>Preview</a></li>
        <li><a href="#/membership" data-link>Membership</a></li>
        <li><a href="#/faq" data-link>FAQ</a></li>
      </ul></div>
      <div><h3>Trust</h3><ul>
        <li><a href="#/safety" data-link>Safety</a></li>
        <li><a href="#/community-guidelines" data-link>Community guidelines</a></li>
        <li><a href="#/contact" data-link>Contact</a></li>
      </ul></div>
      <div><h3>Legal</h3><ul>
        <li><a href="#/terms" data-link>Terms</a></li>
        <li><a href="#/privacy" data-link>Privacy</a></li>
      </ul></div>
    </div>
    <div class="footer-bottom"><div class="container container-lg footer-bottom-row">
      <p>© <span id="year"></span> Hearthside. All rights reserved.</p>
      <p>Made with care. Not affiliated with any other platform.</p>
    </div></div>
  </footer>

<script type="module">
/* ============================================================================
   1. CONFIG
   ============================================================================ */
const SUPABASE_URL      = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";

const BRAND = {
  name: "Hearthside",
  tagline: "A quieter way to meet someone real.",
  supportEmail: "hello@hearthside.example",
  legalEmail: "legal@hearthside.example",
};

let db = null;
if (!SUPABASE_URL.startsWith("https://YOUR")) {
  const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2.45.4");
  db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      flowType: "pkce",
    },
  });
  // Clean up ?code=... after Supabase has exchanged it.
  if (location.search.includes("code=")) {
    setTimeout(() => history.replaceState({}, "", location.pathname + location.hash), 200);
  }
}
window.db = db;

/* ============================================================================
   2. HELPERS
   ============================================================================ */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const html = (strings, ...v) => strings.reduce((o, s, i) => o + s + (v[i] ?? ""), "");
const uuid = () => crypto.randomUUID();

function notice(kind, text) {
  return `<div class="notice notice-${kind}">${escapeHtml(text)}</div>`;
}

function field(label, name, opts = {}) {
  const {
    type = "text", value = "", placeholder = "", required = false,
    help = "", autocomplete = "", min, max, rows = 5, options,
  } = opts;
  const common = `id="f-${name}" name="${name}" ${required ? "required" : ""}`;
  const inputHtml = options
    ? `<select class="select" ${common}>
         ${options.map(([v, l]) => `<option value="${escapeHtml(v)}" ${v === value ? "selected" : ""}>${escapeHtml(l)}</option>`).join("")}
       </select>`
    : rows && type === "textarea"
      ? `<textarea class="textarea" ${common} rows="${rows}" placeholder="${escapeHtml(placeholder)}">${escapeHtml(value)}</textarea>`
      : `<input class="input" ${common} type="${type}" value="${escapeHtml(value)}" placeholder="${escapeHtml(placeholder)}" ${autocomplete ? `autocomplete="${autocomplete}"` : ""} ${min != null ? `min="${min}"` : ""} ${max != null ? `max="${max}"` : ""}>`;
  return `<div class="field">
    <label class="field-label" for="f-${name}">${escapeHtml(label)}${required ? " *" : ""}</label>
    ${inputHtml}
    ${help ? `<p class="field-help">${escapeHtml(help)}</p>` : ""}
  </div>`;
}

/* ============================================================================
   3. THEME
   ============================================================================ */
const THEME_KEY = "hearthside-theme";
const getTheme = () => document.documentElement.getAttribute("data-theme") || "light";
function setTheme(next) {
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(THEME_KEY, next); } catch {}
}
function toggleTheme() { setTheme(getTheme() === "dark" ? "light" : "dark"); }

/* ============================================================================
   4. AUTH STATE
   ============================================================================ */
let session = null;
let profile = null;
let entitlements = null;
let authReady = false;

async function loadEntitlements() {
  if (!session) { entitlements = null; return; }
  const { data } = await db.rpc("my_entitlements");
  entitlements = data || { is_premium: false, unlimited_likes: false, see_likes: false, advanced_filters: false, undo_pass: false };
}

async function loadProfile() {
  if (!session) { profile = null; return; }
  const { data, error } = await db.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if (error) { console.error("[profile]", error); profile = null; return; }
  profile = data;
}

async function refreshAuth() {
  if (!db) { authReady = true; return; }
  const { data } = await db.auth.getSession();
  session = data.session || null;
  if (session) { await loadProfile(); await loadEntitlements(); }
  authReady = true;
}

if (db) {
  db.auth.onAuthStateChange(async (_event, s) => {
    // Avoid re-entrancy during the initial getSession.
    session = s || null;
    if (session) { await loadProfile(); await loadEntitlements(); }
    else { profile = null; entitlements = null; }
    render();
  });
}

/* ============================================================================
   5. API WRAPPERS
   ============================================================================ */
const api = {
  async signUp(email, password, displayName) {
    const { data, error } = await db.auth.signUp({
      email, password,
      options: {
        data: { display_name: displayName },
        emailRedirectTo: location.origin + location.pathname,
      },
    });
    if (error) throw error;
    return data;
  },
  async signIn(email, password) {
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) throw error;
    return data;
  },
  async signOut() { await db.auth.signOut(); },
  async resetPassword(email) {
    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname + "#/reset-password",
    });
    if (error) throw error;
  },
  async updatePassword(newPassword) {
    const { error } = await db.auth.updateUser({ password: newPassword });
    if (error) throw error;
  },
  async updateEmail(newEmail) {
    const { error } = await db.auth.updateUser({ email: newEmail });
    if (error) throw error;
  },
  async updateProfile(patch) {
    const { error } = await db.from("profiles").update(patch).eq("id", session.user.id);
    if (error) throw error;
    await loadProfile();
  },
  async savePreferences(prefs) {
    const { error } = await db.from("user_preferences").upsert({
      user_id: session.user.id,
      ...prefs,
      updated_at: new Date().toISOString(),
    });
    if (error) throw error;
  },
  async loadPreferences() {
    const { data } = await db.from("user_preferences").select("*").eq("user_id", session.user.id).maybeSingle();
    return data;
  },
  async loadInterests() {
    const { data } = await db.from("interests").select("*").order("name");
    return data || [];
  },
  async loadMyInterests() {
    const { data } = await db.from("user_interests").select("interest_id").eq("user_id", session.user.id);
    return (data || []).map((r) => r.interest_id);
  },
  async saveInterests(ids) {
    await db.from("user_interests").delete().eq("user_id", session.user.id);
    if (ids.length) {
      const rows = ids.map((interest_id) => ({ user_id: session.user.id, interest_id }));
      const { error } = await db.from("user_interests").insert(rows);
      if (error) throw error;
    }
  },
  async loadPhotos(userId) {
    const uid = userId || session.user.id;
    const { data } = await db.from("profile_photos").select("*").eq("user_id", uid).order("display_order");
    return data || [];
  },
  async nextPhotoOrder() {
    const { data } = await db.from("profile_photos")
      .select("display_order").eq("user_id", session.user.id)
      .order("display_order", { ascending: false }).limit(1);
    return data && data[0] ? data[0].display_order + 1 : 0;
  },
  async uploadPhoto(file) {
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    const path = `${session.user.id}/${uuid()}.${ext}`;
    const { error: upErr } = await db.storage.from("avatars").upload(path, file, {
      contentType: file.type, upsert: false,
    });
    if (upErr) throw upErr;
    const order = await this.nextPhotoOrder();
    const { error: dbErr } = await db.from("profile_photos").insert({
      user_id: session.user.id,
      storage_path: path,
      display_order: order,
      moderation_status: "pending",
    });
    if (dbErr) throw dbErr;
    return path;
  },
  async deletePhoto(photoId, storagePath) {
    await db.storage.from("avatars").remove([storagePath]);
    await db.from("profile_photos").delete().eq("id", photoId);
  },
  async swapPhotoOrder(a, b) {
    // Simple swap via temp order. Deferrable constraint allows both updates in a tx.
    const { error } = await db.rpc("swap_photo_order", { a_id: a, b_id: b });
    if (error) {
      // Fallback: two-step with a temp negative order.
      await db.from("profile_photos").update({ display_order: -1 }).eq("id", a);
      await db.from("profile_photos").update({ display_order: b }).eq("id", b);
      await db.from("profile_photos").update({ display_order: a }).eq("id", a);
    }
  },
};

/* signed URL cache */
const signedCache = new Map();
async function signedUrl(bucket, path, expiresIn = 3600) {
  const key = `${bucket}/${path}`;
  const hit = signedCache.get(key);
  if (hit && Date.now() < hit.exp - 60_000) return hit.url;
  const { data, error } = await db.storage.from(bucket).createSignedUrl(path, expiresIn);
  if (error) return null;
  signedCache.set(key, { url: data.signedUrl, exp: Date.now() + expiresIn * 1000 });
  return data.signedUrl;
}

/* ============================================================================
   9. ONBOARDING WIZARD
   ============================================================================ */
const ONBOARD_KEY = "hearthside-onboarding";
function loadOnboard() {
  try { return JSON.parse(localStorage.getItem(ONBOARD_KEY)) || {}; } catch { return {}; }
}
function saveOnboard(state) {
  try { localStorage.setItem(ONBOARD_KEY, JSON.stringify(state)); } catch {}
}
function clearOnboard() {
  try { localStorage.removeItem(ONBOARD_KEY); } catch {}
}

let onboardState = {};
let onboardInterests = [];
let onboardSelectedInterests = new Set();
let onboardFiles = []; // [{ file, url }]

const INTENTIONS = [
  "Long-term relationship", "Something serious", "Life partner",
  "Open to possibilities", "New friends first",
];
const GENDERS = ["Woman", "Man", "Non-binary", "Prefer to self-describe"];

const STEPS = [
  { id: 1, title: "The basics", sub: "Just enough for us to introduce you." },
  { id: 2, title: "Where you are", sub: "Country and city. We never show your exact location." },
  { id: 3, title: "What you're looking for", sub: "Intent and a short bio." },
  { id: 4, title: "Your interests", sub: "Pick a few. These help us find people you'll click with." },
  { id: 5, title: "Who you'd like to meet", sub: "Age range and preferences. You can change these later." },
  { id: 6, title: "Add photos", sub: "At least one. Up to four. You can add more later." },
];

async function pageOnboarding() {
  if (!session) { location.hash = "#/login"; return ""; }
  if (profile?.profile_status === "active") { location.hash = "#/discover"; return ""; }

  onboardState = { step: 1, min_age: 18, max_age: 99, location_enabled: false, ...loadOnboard() };
  if (!onboardInterests.length) onboardInterests = await api.loadInterests();

  return `<div class="wizard" id="wizard">${renderWizard()}</div>`;
}

function renderWizard() {
  const step = onboardState.step || 1;
  const s = STEPS.find((x) => x.id === step);
  return html`
    <div class="wizard-progress">
      ${STEPS.map((x) => `<span class="${x.id < step ? "done" : x.id === step ? "current" : ""}"></span>`).join("")}
    </div>
    <p class="wizard-step-label">Step ${step} of ${STEPS.length}</p>
    <h2>${s.title}</h2>
    <p class="sub">${s.sub}</p>
    <div id="wizard-step">${renderWizardStep(step)}</div>
    <div class="wizard-actions">
      ${step > 1 ? `<button class="btn btn-secondary" id="wiz-back" type="button">Back</button>` : "<span></span>"}
      <button class="btn btn-primary" id="wiz-next" type="button">${step === STEPS.length ? "Finish" : "Continue"}</button>
    </div>
    <div id="wizard-notice"></div>`;
}

function renderWizardStep(step) {
  const s = onboardState;
  if (step === 1) {
    return html`
      ${field("Display name", "display_name", { required: true, value: s.display_name || "", placeholder: "What should we call you?" })}
      ${field("Date of birth", "date_of_birth", { type: "date", required: true, value: s.date_of_birth || "", help: "You must be 18 or older." })}
      ${field("Gender", "gender", { value: s.gender || "", options: [["", "Select..."], ...GENDERS.map((g) => [g, g])] })}`;
  }
  if (step === 2) {
    return html`
      ${field("Country", "country_code", { value: s.country_code || "", placeholder: "Two-letter country code, e.g. US, GB, DE", help: "Optional but helps distance filtering." })}
      ${field("City", "city", { value: s.city || "", placeholder: "e.g. Berlin" })}`;
  }
  if (step === 3) {
    return html`
      ${field("What are you looking for?", "relationship_intention", { value: s.relationship_intention || "", options: [["", "Select..."], ...INTENTIONS.map((i) => [i, i])] })}
      ${field("Short bio", "bio", { type: "textarea", value: s.bio || "", placeholder: "A few sentences about you. What you do, what you love, what you're hoping to find.", help: "Up to 500 characters." })}`;
  }
  if (step === 4) {
    const selected = onboardSelectedInterests;
    return html`
      <div class="chip-row" id="interest-chips">
        ${onboardInterests.map((i) => `<button type="button" class="chip ${selected.has(i.id) ? "selected" : ""}" data-interest="${i.id}">${escapeHtml(i.name)}</button>`).join("")}
      </div>
      <p class="field-help" style="margin-top:12px;">Pick as many as you like. These show on your profile.</p>`;
  }
  if (step === 5) {
    return html`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        ${field("Min age", "min_age", { type: "number", value: s.min_age || 18, min: 18, max: 99 })}
        ${field("Max age", "max_age", { type: "number", value: s.max_age || 99, min: 18, max: 99 })}
      </div>
      ${field("Preferred genders", "preferred_genders", { value: "", options: [["", "Any"], ...GENDERS.map((g) => [g, g])] })}
      <label class="row" style="gap:8px;margin-top:8px;">
        <input type="checkbox" id="f-location_enabled" ${s.location_enabled ? "checked" : ""}>
        <span class="small">Enable distance-based discovery (uses city-level location only)</span>
      </label>
      ${field("Max distance (km)", "max_distance_km", { type: "number", value: s.max_distance_km || 50, min: 1, max: 500 })}`;
  }
  if (step === 6) {
    return html`
      <div class="photo-grid" id="photo-grid">
        ${[0,1,2,3].map((i) => {
          const f = onboardFiles[i];
          return f
            ? `<div class="photo-slot" data-slot="${i}">
                <img src="${f.url}" alt="">
                <button type="button" class="remove" data-remove="${i}" aria-label="Remove photo">×</button>
              </div>`
            : `<label class="photo-slot" data-slot="${i}">
                <input type="file" accept="image/jpeg,image/png,image/webp" hidden data-file="${i}">
                <span class="muted small">${i === 0 ? "Add a photo (required)" : "Add another"}</span>
              </label>`;
        }).join("")}
      </div>
      <p class="field-help" style="margin-top:12px;">JPEG, PNG, or WebP. Up to 10 MB each. Photos are reviewed before they appear in discovery.</p>`;
  }
  return "";
}

function readWizardStep(step) {
  const s = onboardState;
  const val = (name) => {
    const el = document.getElementById(`f-${name}`);
    return el ? el.value.trim() : undefined;
  };
  if (step === 1) {
    s.display_name = val("display_name") || s.display_name;
    s.date_of_birth = val("date_of_birth") || s.date_of_birth;
    s.gender = val("gender") || s.gender;
  } else if (step === 2) {
    s.country_code = (val("country_code") || "").toUpperCase().slice(0, 2);
    s.city = val("city") || s.city;
  } else if (step === 3) {
    s.relationship_intention = val("relationship_intention") || s.relationship_intention;
    s.bio = (val("bio") || "").slice(0, 500);
  } else if (step === 5) {
    s.min_age = Number(val("min_age")) || 18;
    s.max_age = Number(val("max_age")) || 99;
    const genderEl = document.getElementById("f-preferred_genders");
    s.preferred_genders = genderEl && genderEl.value ? [genderEl.value] : [];
    s.location_enabled = !!document.getElementById("f-location_enabled")?.checked;
    s.max_distance_km = Number(val("max_distance_km")) || null;
  }
}

function validateWizardStep(step) {
  const s = onboardState;
  if (step === 1) {
    if (!s.display_name || s.display_name.length < 2) return "Please enter a display name (2+ characters).";
    if (!s.date_of_birth) return "Please enter your date of birth.";
    const age = (Date.now() - new Date(s.date_of_birth).getTime()) / (1000 * 60 * 60 * 24 * 365.25);
    if (age < 18) return "You must be 18 or older to use Hearthside.";
    if (age > 120) return "Please enter a valid date of birth.";
  }
  if (step === 3 && !s.relationship_intention) return "Please choose what you're looking for.";
  if (step === 5) {
    if (s.min_age > s.max_age) return "Minimum age can't be greater than maximum.";
    if (s.min_age < 18) return "Minimum age can't be below 18.";
  }
  if (step === 6 && onboardFiles.length === 0) return "Please add at least one photo.";
  return null;
}

async function finishOnboarding() {
  const s = onboardState;
  // 1. Update profile
  await api.updateProfile({
    display_name: s.display_name,
    date_of_birth: s.date_of_birth,
    gender: s.gender || null,
    country_code: s.country_code || null,
    city: s.city || null,
    relationship_intention: s.relationship_intention || null,
    bio: s.bio || null,
    profile_status: "active",
    is_discoverable: true,
  });
  // 2. Interests
  await api.saveInterests(Array.from(onboardSelectedInterests));
  // 3. Preferences
  await api.savePreferences({
    min_age: s.min_age || 18,
    max_age: s.max_age || 99,
    preferred_genders: s.preferred_genders || [],
    preferred_relationship_intentions: s.relationship_intention ? [s.relationship_intention] : [],
    max_distance_km: s.location_enabled ? (s.max_distance_km || 50) : null,
    location_enabled: !!s.location_enabled,
  });
  // 4. Photos
  for (const f of onboardFiles) {
    await api.uploadPhoto(f.file);
  }
  clearOnboard();
  onboardState = {};
  onboardFiles = [];
  onboardSelectedInterests.clear();
  await loadProfile();
  location.hash = "#/discover";
}

/* ============================================================================

   ============================================================================ */
const routes = [
  { p: "/",                       h: publicPages["/"], auth: false },
  { p: "/how-it-works",           h: publicPages["/how-it-works"], auth: false },
  { p: "/discover-preview",       h: publicPages["/discover-preview"], auth: false },
  { p: "/membership",             h: publicPages["/membership"], auth: false },
  { p: "/safety",                 h: publicPages["/safety"], auth: false },
  { p: "/about",                  h: publicPages["/about"], auth: false },
  { p: "/faq",                    h: publicPages["/faq"], auth: false },
  { p: "/contact",                h: publicPages["/contact"], auth: false },
  { p: "/terms",                  h: publicPages["/terms"], auth: false },
  { p: "/privacy",                h: publicPages["/privacy"], auth: false },
  { p: "/community-guidelines",   h: publicPages["/community-guidelines"], auth: false },

  { p: "/signup",                 h: pageSignup,          auth: false },
  { p: "/login",                  h: pageLogin,           auth: false },
  { p: "/forgot-password",        h: pageForgotPassword,  auth: false },
  { p: "/reset-password",         h: pageResetPassword,   auth: false },
  { p: "/verify-email",           h: pageVerifyEmail,     auth: false },

  { p: "/onboarding",             h: pageOnboarding,      auth: true },
  { p: "/discover",               h: pageDiscover,        auth: true, onboarded: true },
  { p: "/matches",                h: pageMatches,         auth: true, onboarded: true },
  { p: "/messages",               h: pageMessages,        auth: true, onboarded: true },

  { p: "/settings/profile",       h: pageSettingsProfile,     auth: true },
  { p: "/settings/preferences",   h: pageSettingsPreferences, auth: true },
  { p: "/settings/security",      h: pageSettingsSecurity,    auth: true },
  { p: "/settings/account",       h: pageSettingsAccount,     auth: true },
];

function matchRoute(path) {
  for (const r of routes) {
    const rp = r.p.split("/").filter(Boolean);
    const pp = path.split("/").filter(Boolean);
    if (rp.length !== pp.length) continue;
    const params = {};
    let ok = true;
    for (let i = 0; i < rp.length; i++) {
      if (rp[i].startsWith(":")) params[rp[i].slice(1)] = pp[i];
      else if (rp[i] !== pp[i]) { ok = false; break; }
    }
    if (ok) return { route: r, params };
  }
  return null;
}

function currentPath() {
  const hash = location.hash.replace(/^#/, "");
  if (!hash || hash === "/") return "/";
  return hash.split("?")[0].replace(/\/+$/, "") || "/";
}

let rendering = false;
async function render() {
  if (rendering) return;
  rendering = true;
  try {
    const path = currentPath();
    const match = matchRoute(path);
    const app = $("#app");

    if (!match) { app.innerHTML = notFoundPage(); return; }

    const { route, params } = match;

    // Route guards
    if (route.auth && !session) {
      location.hash = "#/login";
      return;
    }
    if (route.onboarded && profile && profile.profile_status !== "active" && path !== "/onboarding") {
      location.hash = "#/onboarding";
      return;
    }

    // Render
    const result = route.h;
    const htmlStr = typeof result === "function" && result.length >= 1 && route.p.includes(":")
      ? await result(params)
      : await result();
    app.innerHTML = htmlStr || "";

    // Attach page-specific handlers
    attachHandlers(path, params);
    updateNavActive(path);
    updateTitle(path);
    window.scrollTo({ top: 0, behavior: "instant" });
  } finally {
    rendering = false;
  }
}

function updateNavActive(path) {
  $$(".nav-desktop a").forEach((a) => {
    const href = a.getAttribute("href");
    a.classList.toggle("active", href === `#${path}`);
  });
}

function updateTitle(path) {
  const titles = {
    "/": `${BRAND.name} — ${BRAND.tagline}`,
    "/how-it-works": `How it works · ${BRAND.name}`,
    "/discover-preview": `Discover preview · ${BRAND.name}`,
    "/membership": `Membership · ${BRAND.name}`,
    "/safety": `Safety · ${BRAND.name}`,
    "/about": `About · ${BRAND.name}`,
    "/faq": `FAQ · ${BRAND.name}`,
    "/contact": `Contact · ${BRAND.name}`,
    "/terms": `Terms of service · ${BRAND.name}`,
    "/privacy": `Privacy policy · ${BRAND.name}`,
    "/community-guidelines": `Community guidelines · ${BRAND.name}`,
    "/signup": `Create your account · ${BRAND.name}`,
    "/login": `Log in · ${BRAND.name}`,
    "/forgot-password": `Reset password · ${BRAND.name}`,
    "/reset-password": `Set a new password · ${BRAND.name}`,
    "/onboarding": `Onboarding · ${BRAND.name}`,
    "/discover": `Discover · ${BRAND.name}`,
    "/matches": `Matches · ${BRAND.name}`,
    "/messages": `Messages · ${BRAND.name}`,
    "/settings/profile": `Profile · ${BRAND.name}`,
    "/settings/preferences": `Preferences · ${BRAND.name}`,
    "/settings/security": `Security · ${BRAND.name}`,
    "/settings/account": `Account · ${BRAND.name}`,

  document.title = titles[path] || `Not found · ${BRAND.name}`;

/* ============================================================================
   13. PAGE HANDLERS (attach DOM listeners after render)
   ============================================================================ */
function attachHandlers(path, params) {
  if (path === "/signup")            attachSignup();
  else if (path === "/login")        attachLogin();
  else if (path === "/forgot-password") attachForgotPassword();
  else if (path === "/reset-password")  attachResetPassword();
  else if (path === "/onboarding")   attachOnboarding();
  else if (path === "/settings/profile")     attachSettingsProfile();
  else if (path === "/settings/preferences") attachSettingsPreferences();
  else if (path === "/settings/security")    attachSettingsSecurity();
  else if (path === "/settings/account")     attachSettingsAccount();
}

function showNotice(id, kind, text) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = notice(kind, text);
}

function attachSignup() {
  const form = document.getElementById("signup-form");
  if (!form) return;
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const dn = String(fd.get("display_name")).trim();
    const email = String(fd.get("email")).trim();
    const password = String(fd.get("password"));
    const password2 = String(fd.get("password2"));
    showNotice("signup-notice", "info", "");
    if (dn.length < 2) return showNotice("signup-notice", "error", "Display name must be at least 2 characters.");
    if (password.length < 8) return showNotice("signup-notice", "error", "Password must be at least 8 characters.");
    if (password !== password2) return showNotice("signup-notice", "error", "Passwords do not match.");
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "Creating account…";
    try {
      const data = await api.signUp(email, password, dn);
      if (data.session) {
        await loadProfile();
        location.hash = profile?.profile_status === "active" ? "#/discover" : "#/onboarding";
      } else {
        location.hash = "#/verify-email";
      }
    } catch (err) {
      showNotice("signup-notice", "error", err.message || "Could not create account.");
      btn.disabled = false; btn.textContent = "Create account";
    }
  });
}

function attachOnboarding() {
  const next = document.getElementById("wiz-next");
  const back = document.getElementById("wiz-back");
  if (!next) return;

  // Interests chip toggling
  $$("#interest-chips .chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      const id = chip.dataset.interest;
      if (onboardSelectedInterests.has(id)) onboardSelectedInterests.delete(id);
      else onboardSelectedInterests.add(id);
      chip.classList.toggle("selected");
    });
  });

  // Photo file inputs
  $$("#photo-grid input[type=file]").forEach((inp) => {
    inp.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) return alert("File is too large (max 10 MB).");
      if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) return alert("Only JPEG, PNG, or WebP.");
      const slot = Number(inp.dataset.file);
      onboardFiles[slot] = { file, url: URL.createObjectURL(file) };
      document.getElementById("wizard-step").innerHTML = renderWizardStep(6);
      attachOnboardingPhotos();
    });
  });

  // Prefill interests if coming back to step 4
  if ((onboardState.step || 1) === 4 && onboardSelectedInterests.size) {
    $$("#interest-chips .chip").forEach((c) => {
      if (onboardSelectedInterests.has(c.dataset.interest)) c.classList.add("selected");
    });
  }

  next.addEventListener("click", async () => {
    const step = onboardState.step || 1;
    readWizardStep(step);
    const err = validateWizardStep(step);
    if (err) return showNotice("wizard-notice", "error", err);
    saveOnboard(onboardState);
    if (step === STEPS.length) {
      next.disabled = true; next.textContent = "Saving…";
      try {
        await finishOnboarding();
      } catch (e) {
        console.error(e);
        showNotice("wizard-notice", "error", e.message || "Could not save. Check your connection.");
        next.disabled = false; next.textContent = "Finish";
      }
      return;
    }
    onboardState.step = step + 1;
    saveOnboard(onboardState);
    document.getElementById("wizard").innerHTML = renderWizard();
    attachOnboarding();
  });

  back?.addEventListener("click", () => {
    readWizardStep(onboardState.step);
    saveOnboard(onboardState);
    onboardState.step = Math.max(1, (onboardState.step || 1) - 1);
    document.getElementById("wizard").innerHTML = renderWizard();
    attachOnboarding();
  });
}

function attachOnboardingPhotos() {
  $$("#photo-grid input[type=file]").forEach((inp) => {
    inp.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) return alert("File is too large (max 10 MB).");
      if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) return alert("Only JPEG, PNG, or WebP.");
      const slot = Number(inp.dataset.file);
      onboardFiles[slot] = { file, url: URL.createObjectURL(file) };
      document.getElementById("wizard-step").innerHTML = renderWizardStep(6);
      attachOnboardingPhotos();
    });
  });
  $$("#photo-grid [data-remove]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      const idx = Number(btn.dataset.remove);
      onboardFiles.splice(idx, 1);
      onboardFiles = onboardFiles.filter(Boolean);
      document.getElementById("wizard-step").innerHTML = renderWizardStep(6);
      attachOnboardingPhotos();
    });
  });
}

function attachSettingsProfile() {
  const form = document.getElementById("profile-form");
  // Interests toggling
  const selected = new Set();
  $$("#interest-chips .chip").forEach((chip) => {
    if (chip.classList.contains("selected")) selected.add(chip.dataset.interest);
    chip.addEventListener("click", () => {
      if (selected.has(chip.dataset.interest)) selected.delete(chip.dataset.interest);
      else selected.add(chip.dataset.interest);
      chip.classList.toggle("selected");
    });
  });

  // Photo upload
  const addInput = document.getElementById("add-photo");
  addInput?.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) return alert("File is too large (max 10 MB).");
    try {
      addInput.disabled = true;
      await api.uploadPhoto(file);
      await render();
    } catch (err) {
      showNotice("profile-notice", "error", err.message || "Upload failed.");
      addInput.disabled = false;
    }
  });
  $$("[data-delete]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this photo?")) return;
      try {
        await api.deletePhoto(btn.dataset.delete, btn.dataset.path);
        await render();
      } catch (err) {
        showNotice("profile-notice", "error", err.message || "Could not delete.");
      }
    });
  });

  form?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    try {
      await api.updateProfile({
        display_name: String(fd.get("display_name")).trim(),
        date_of_birth: String(fd.get("date_of_birth")) || null,
        gender: String(fd.get("gender")) || null,
        country_code: String(fd.get("country_code")).toUpperCase().slice(0, 2) || null,
        city: String(fd.get("city")) || null,
        relationship_intention: String(fd.get("relationship_intention")) || null,
        bio: String(fd.get("bio")).slice(0, 500) || null,
      });
      await api.saveInterests(Array.from(selected));
      showNotice("profile-notice", "success", "Profile updated.");
      renderHeader();
    } catch (err) {
      showNotice("profile-notice", "error", err.message || "Could not save.");
    }
  });
}

function attachSettingsAccount() {
  document.getElementById("export-btn")?.addEventListener("click", async () => {
    try {
      const [p, ph, prefs, ints, likes, passes, matches, blocks] = await Promise.all([
        db.from("profiles").select("*").eq("id", session.user.id).maybeSingle(),
        db.from("profile_photos").select("*").eq("user_id", session.user.id),
        db.from("user_preferences").select("*").eq("user_id", session.user.id).maybeSingle(),
        db.from("user_interests").select("*").eq("user_id", session.user.id),
        db.from("likes").select("*").eq("actor_id", session.user.id),
        db.from("passes").select("*").eq("actor_id", session.user.id),
        db.from("matches").select("*").or(`user_a_id.eq.${session.user.id},user_b_id.eq.${session.user.id}`),
        db.from("user_blocks").select("*").eq("blocker_id", session.user.id),
      ]);
      const payload = {
        exported_at: new Date().toISOString(),
        user: { id: session.user.id, email: session.user.email },
        profile: p.data, photos: ph.data, preferences: prefs.data,
        interests: ints.data, likes: likes.data, passes: passes.data,
        matches: matches.data, blocks: blocks.data,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `hearthside-export-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      showNotice("account-notice", "error", err.message || "Could not export.");
    }
  });

  document.getElementById("delete-btn")?.addEventListener("click", async () => {
    const confirmText = prompt(
      "This will hide your profile immediately and permanently delete your account within 30 days.\n\n" +
      "Type DELETE (all caps) to confirm:"
    );
    if (confirmText !== "DELETE") return;
    try {
      // Soft-delete the profile now; the row is anonymised.
      await db.from("profiles").update({
        profile_status: "deleted",
        is_discoverable: false,
        display_name: "Deleted member",
        bio: null, city: null, gender: null, date_of_birth: null,
        relationship_intention: null, country_code: null,
      }).eq("id", session.user.id);
      await db.from("profile_photos").delete().eq("user_id", session.user.id);
      await api.signOut();
      location.hash = "#/";
      alert("Your account has been scheduled for deletion. You have been signed out.");
    } catch (err) {
      showNotice("account-notice", "error", err.message || "Could not delete account.");
    }
  });
}
