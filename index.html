<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Game</title>

<style>
  body { font-family: Arial; text-align: center; }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 60px);
    gap: 5px;
    justify-content: center;
    margin-top: 20px;
  }
  .cell {
    border: 1px solid #333;
    padding: 15px;
    cursor: pointer;
  }
  .marked {
    background: green;
    color: white;
  }
</style>
</head>
<body>

<h2 id="title">Loading...</h2>
<p id="userInfo"></p>
<button onclick="joinGame()">Join Game</button>
<button onclick="checkWin()">Check Win</button>

<div id="card" class="grid"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
let telegramId = null;
let cardData = [];
let marked = [];

/* ======================
   TELEGRAM LOGIN
====================== */
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe.user;

if (!user) {
  document.body.innerHTML = "❌ Open inside Telegram";
} else {
  telegramId = user.id;

  fetch('/auth', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      telegramId: user.id,
      username: user.username,
      firstName: user.first_name
    })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("title").innerText = "🎮 Bingo Game";
    document.getElementById("userInfo").innerText =
      `Welcome ${data.first_name} (@${data.username}) | Balance: ${data.balance}`;
  });
}


/* ======================
   JOIN GAME
====================== */
function joinGame() {
  fetch('/join', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ telegramId })
  })
  .then(res => res.json())
  .then(data => {
    cardData = data.card;
    marked = [];
    renderCard();
  });
}


/* ======================
   RENDER CARD
====================== */
function renderCard() {
  const card = document.getElementById('card');
  card.innerHTML = "";

  cardData.forEach(num => {
    const div = document.createElement('div');
    div.className = "cell";
    div.innerText = num;

    div.onclick = () => markNumber(num, div);

    card.appendChild(div);
  });
}


/* ======================
   MARK NUMBER
====================== */
function markNumber(num, el) {
  fetch('/mark', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ telegramId, number: num })
  })
  .then(res => res.json())
  .then(data => {
    marked = data.marked;
    el.classList.add("marked");
  });
}


/* ======================
   CHECK WIN
====================== */
function checkWin() {
  fetch('/check-win', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ telegramId })
  })
  .then(res => res.json())
  .then(data => {
    if (data.winner) {
      alert("🏆 YOU WIN!");
    } else {
      alert("❌ Not yet");
    }
  });
}
</script>

</body>
</html>
